const draw=()=>{const v=q.value.trim().toLowerCase();ix=-1;
 if(!v){list=[];ul.hidden=true;q.setAttribute("aria-expanded","false");return}
 list=find(v).map(c=>({c,s:c.name.toLowerCase().startsWith(v)?3:c.name.toLowerCase().includes(v)?2:1})).sort((a,b)=>b.s-a.s||b.c.year-a.c.year).slice(0,8).map(x=>x.c);
 ul.hidden=false;q.setAttribute("aria-expanded",String(list.length>0));
 ul.innerHTML=list.length?list.map((c,i)=>`<li role="option" data-i="${i}">${mono(c)}<span class="nm">${hl(c.name,q.value)}</span><span class="mt">${hl(c.mfr,q.value)} · ${c.year} · ${esc(c.proc)}</span><span class="ct">${esc(CATS[c.cat])}</span></li>`).join("")+'<li class="hint" aria-hidden="true">↑ ↓ navigate · Enter select · Esc close</li>':`<li class="hint empty" aria-hidden="true">No chips match “${esc(q.value.trim())}”</li>`};
q.addEventListener("input",debounce(draw,90));
q.addEventListener("focus",()=>{if(q.value.trim())draw()});
q.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(ul.hidden)draw();const n=opts().length;if(!n)return;ix=(ix+(e.key==="ArrowDown"?1:-1)+n)%n;mark()}
else if(e.key==="Enter"){e.preventDefault();const c=list[Math.max(ix,0)];if(c){ul.hidden=true;q.value="";q.blur();pick(c)}else if(q.value.trim())location.hash="#/explorer?q="+encodeURIComponent(q.value.trim())}else if(e.key==="Escape"){ul.hidden=true}});
ul.addEventListener("pointerdown",e=>{const li=e.target.closest("[role=option]");if(li){e.preventDefault();ul.hidden=true;q.value="";q.blur();pick(list[li.dataset.i])}});
ul.addEventListener("mousemove",e=>{const li=e.target.closest("[role=option]");if(li){const n=opts().indexOf(li);if(n!==ix){ix=n;mark()}}});
q.addEventListener("blur",()=>setTimeout(()=>{ul.hidden=true},150))}
/* star-fall background: pauses when tab hidden, static for reduced motion, off in light theme */
(()=>{const cv=document.getElementById("stars"),cx=cv.getContext("2d");if(!cx)return;const rm=matchMedia("(prefers-reduced-motion:reduce)").matches,R=Math.random,dpr=Math.min(devicePixelRatio||1,1.5);
let W,H,S=[],D=[],raf=0;const nw=()=>({x:R()*(W+300),y:-30-R()*H*.3,v:2+R()*3.2,l:40+R()*90,a:.35+R()*.55,r:.6+R()*1.2});
function draw(t){cx.clearRect(0,0,W,H);const L=document.documentElement.dataset.theme==="light";cx.fillStyle=L?"#7a5af8":"#cfe6ff";
for(const d of D){cx.globalAlpha=.3+.3*Math.sin(t/900+d.p);cx.beginPath();cx.arc(d.x,d.y,d.r,0,6.3);cx.fill()}
if(rm)return;cx.globalAlpha=1;cx.lineCap="round";
for(const s of S){s.x-=s.v*.45;s.y+=s.v;const k=s.l/s.v,tx=s.x+s.v*.45*k,ty=s.y-s.v*k,g=cx.createLinearGradient(s.x,s.y,tx,ty);
g.addColorStop(0,L?"rgba(90,80,230,"+s.a*.75+")":"rgba(200,235,255,"+s.a+")");g.addColorStop(1,L?"rgba(37,99,235,0)":"rgba(92,200,255,0)");cx.strokeStyle=g;cx.lineWidth=s.r;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(tx,ty);cx.stroke();
if(s.y>H+20||s.x<-60)Object.assign(s,nw())}}
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
S=Array.from({length:Math.min(40,Math.round(W/28))},()=>{const s=nw();s.y=R()*H;return s});D=Array.from({length:Math.min(90,Math.round(W/14))},()=>({x:R()*W,y:R()*H,r:R()*1.1+.3,p:R()*6}));draw(0)}
const loop=t=>{draw(t);raf=requestAnimationFrame(loop)};size();
if(!rm){raf=requestAnimationFrame(loop);document.addEventListener("visibilitychange",()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(loop)})}
addEventListener("resize",debounce(size,200))})();
/* ---- Router ---- */
function route(){const h=location.hash.slice(1)||"/",[path,qs]=h.split("?"),p=new URLSearchParams(qs||""),seg=path.split("/");
document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+path));
try{({"":()=>home(),explorer:()=>explorer(p),chip:()=>chip(seg[2]),compare:()=>compare(p),bench:()=>bench(p),games:()=>games(p)}[seg[1]||""]||home)()}
catch(e){console.error(e);app.innerHTML=`<div class="note">Something went wrong rendering this page: ${esc(e.message)}. <a href="#/">Go home</a></div>`}
window.scrollTo(0,0);tray();post()}
addEventListener("hashchange",route);
const th=ls.get("cc_theme","dark");document.documentElement.dataset.theme=th;
$("#theme").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;ls.set("cc_theme",n);dispatchEvent(new Event("resize"))};
document.documentElement.lang=lang;$("#lang").textContent=lang==="th"?"EN":"TH";$("#lang").onclick=()=>{ls.set("cc_lang",lang==="th"?"en":"th");location.reload()};
ac($("#nq"),$("#nsug"),c=>{location.hash="#/chip/"+c.id});
route();
</script></body></html>
